<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LOGICART — Mapa da Campanha</title>
  <link rel="stylesheet" href="../css/global.css">
  <link rel="stylesheet" href="../css/map.css">
</head>
<body class="page-enter">

  <canvas class="stars-canvas" id="stars-canvas"></canvas>

  <div class="map-header">
    <h2 class="neon-title">MAPA DA CAMPANHA</h2>
    <div class="sub">Selecione uma missão para jogar</div>
  </div>

  <!-- Campaign progress bar -->
  <div class="map-progress">
    <span id="prog-label">0 / 7 missões</span>
    <div class="bar-track prog-track" style="height:8px">
      <div class="bar-fill bar-xp" id="prog-fill" style="width:0%"></div>
    </div>
    <span id="star-total">0 ⭐</span>
  </div>

  <!-- Mission cards generated by JS -->
  <div class="day-grid" id="day-grid"></div>

  <div class="map-back">
    <button class="btn btn-secondary btn-md" onclick="window.location.href='menu.html'">
      ← MENU
    </button>
  </div>

<script type="module">
  import { initStarfield }   from '../src/ui/starfield.js';
  import { loadState, saveState } from '../src/Core/GameState.js';
  import { MISSIONS, DAYS_OF_WEEK } from '../src/Core/MapData.js';

  initStarfield(document.getElementById('stars-canvas'));

  const state = loadState();

  // Update progress bar
  const completed  = state.missions.filter(m => m.starCount > 0).length;
  const totalStars = state.missions.reduce((s, m) => s + (m.starCount || 0), 0);
  document.getElementById('prog-label').textContent  = `${completed} / ${MISSIONS.length} missões`;
  document.getElementById('star-total').textContent   = totalStars + ' ⭐';
  document.getElementById('prog-fill').style.width    = (completed / MISSIONS.length * 100) + '%';

  // Build mission cards
  const grid = document.getElementById('day-grid');

  MISSIONS.forEach((m, i) => {
    const mState  = state.missions[i];
    const locked  = !mState.unlocked;
    const stars   = mState.starCount || 0;
    const starStr = ['', '⭐', '⭐⭐', '⭐⭐⭐'][Math.min(stars, 3)];
    const dayName = DAYS_OF_WEEK[(m.day - 1) % 7];

    const card = document.createElement('div');
    card.className = [
      'day-card',
      locked       ? 'locked'    : '',
      stars > 0    ? 'completed' : '',
      m.wednesday  ? 'wednesday' : '',
    ].join(' ').trim();

    card.innerHTML = `
      <div class="dc-num">MISSÃO ${i + 1}</div>
      <div class="dc-day">DIA ${m.day} — ${dayName}</div>
      <div class="dc-title">${m.name}</div>
      <div class="dc-stars">${locked ? '' : (starStr || '—')}</div>
      <div class="dc-desc">${m.desc}</div>
      ${m.wednesday ? '<div class="dc-badge">🌸 ROSA</div>' : ''}
    `;

    if (!locked) {
      card.onclick = () => {
        // Store which mission to load
        state.currentMission = i;
        saveState(state);
        window.location.href = 'briefing.html';
      };
    }

    grid.appendChild(card);
  });
</script>
</body>
</html>
